<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Drust loading splash</title>
  <desc id="desc">Loading screen with mouse-inspired Drust badge, DRUST wordmark, and tactical scan bar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081015"/>
      <stop offset="1" stop-color="#111d24"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b36c"/>
      <stop offset="1" stop-color="#d68b37"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a35f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9a35f"/>
      <stop offset="1" stop-color="#d9a35f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#d9a35f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d9a35f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>
  <g opacity="0.07">
    <path d="M0 180h1440M0 360h1440M0 540h1440M0 720h1440" stroke="#d9a35f" stroke-width="1"/>
    <path d="M180 0v900M360 0v900M540 0v900M720 0v900M900 0v900M1080 0v900M1260 0v900" stroke="#d9a35f" stroke-width="1"/>
  </g>
  <g transform="translate(420 220)">
    <circle cx="82" cy="82" r="60" fill="#081015" stroke="url(#amber)" stroke-width="10"/>
    <ellipse cx="67" cy="84" rx="24" ry="16" fill="#d9a35f"/>
    <ellipse cx="92" cy="74" rx="20" ry="15" fill="#d9a35f"/>
    <circle cx="77" cy="58" r="11" fill="#d9a35f"/>
    <path d="M72 47c1-6 4-10 9-10 6 0 9 4 11 10 0 2-.1 4-1.4 5.2-1 .9-2.3 1.3-4 1.3-4.1 0-7.7-1.5-9.6-6.5z" fill="#d9a35f"/>
    <path d="M87 70c1.8-.9 4.1-1.2 6.5-.9" fill="none" stroke="#081015" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M86.7 71.7c1.8-.4 3.7-.2 5.6.5" fill="none" stroke="#081015" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M86.5 72.8c1.2.2 2.2.7 3 1.5" fill="none" stroke="#081015" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="91" cy="73.2" r="1" fill="#081015"/>
    <path d="M56.5 87.7c-1.1 1.2-1.7 2.5-1.8 4.1 0 2.1 1.2 3.8 3.4 4.8 2 .9 4.5 1 7.1.4 2.7-.6 4.7-1.8 6.3-3.7 1.2-1.5 1.9-3.1 2.1-4.9" fill="none" stroke="#d9a35f" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M56 95c-10 4-17 11-20 20" fill="none" stroke="#d9a35f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M57 100c2 10 3 18 3 29" fill="none" stroke="#d9a35f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="588" y="393"
        fill="#d9a35f"
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="92"
        font-weight="800"
        letter-spacing="0.14em">DRUST</text>
  <text x="592" y="435"
        fill="#8fa3ad"
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="19"
        font-weight="600"
        letter-spacing="0.34em">RUST+ / DISCORD / OPERATIONS</text>
  <g transform="translate(380 512)">
    <rect width="680" height="10" rx="5" fill="#15242d"/>
    <rect width="180" height="10" rx="5" fill="url(#scan)">
      <animate attributeName="x" values="0;500;0" dur="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(560 570)" fill="#d9a35f" fill-opacity="0.6">
    <circle cx="0" cy="0" r="3">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="0" r="3">
      <animate attributeName="opacity" values="0.35;1;0.35" begin="0.2s" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="0" r="3">
      <animate attributeName="opacity" values="0.35;1;0.35" begin="0.4s" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
