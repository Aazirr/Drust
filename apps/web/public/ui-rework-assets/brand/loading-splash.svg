<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Drust loading splash</title>
  <desc id="desc">Dark tactical loading screen with Drust monogram, wordmark, and sweeping scan bar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081015"/>
      <stop offset="1" stop-color="#111d24"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4b06a"/>
      <stop offset="1" stop-color="#d78f3d"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a35f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9a35f"/>
      <stop offset="1" stop-color="#d9a35f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#d9a35f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d9a35f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>
  <g opacity="0.08">
    <path d="M0 180h1440M0 360h1440M0 540h1440M0 720h1440" stroke="#d9a35f" stroke-width="1"/>
    <path d="M180 0v900M360 0v900M540 0v900M720 0v900M900 0v900M1080 0v900M1260 0v900" stroke="#d9a35f" stroke-width="1"/>
  </g>
  <g transform="translate(430 200)">
    <path d="M62 0 110 16v52c0 28-12 49-36 67-24-18-36-39-36-67V16z" fill="url(#amber)"/>
    <path d="M62 16c17 0 31 5 40 16 9 10 14 24 14 42 0 17-5 31-14 42-9 10-23 16-40 16s-31-6-40-16C13 105 8 91 8 74c0-18 5-32 14-42C31 21 45 16 62 16z" fill="#081015"/>
    <path d="M62 36c10 0 19 3 25 10 6 6 9 15 9 28 0 12-3 22-9 28-6 7-15 10-25 10H44V36zm-2 16v44h8c8 0 13-2 17-6 3-4 5-10 5-16 0-8-2-13-5-17-4-3-9-5-17-5z" fill="#d9a35f"/>
    <path d="M26 126h72" stroke="#d9a35f" stroke-opacity="0.22" stroke-width="2"/>
  </g>
  <g transform="translate(545 318)">
    <path d="M0 0h22l22 34 22-34h22L50 50l39 52H67L44 66 21 102H0l39-52z" fill="#d9a35f" opacity="0.92"/>
    <path d="M121 0h22l22 34 22-34h22L171 50l39 52h-22l-23-36-23 36h-22l39-52z" fill="#d9a35f" opacity="0.92"/>
    <path d="M242 0h20v73c0 11 5 17 16 17s16-6 16-17V0h20v75c0 13-4 23-12 31-8 8-19 12-32 12s-24-4-32-12c-8-8-12-18-12-31z" fill="#d9a35f"/>
    <path d="M358 0h46c15 0 27 4 35 11 8 7 12 17 12 29 0 10-3 19-10 26-6 6-14 10-25 12l39 46h-25l-37-44h-15v44h-20zm20 18v40h23c10 0 17-2 22-5 4-4 7-10 7-17 0-8-3-13-7-17-5-4-12-5-22-5z" fill="#d9a35f"/>
    <path d="M504 0h19l28 72L579 0h19L548 111h-9z" fill="#d9a35f"/>
