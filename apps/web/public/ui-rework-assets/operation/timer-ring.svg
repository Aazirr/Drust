<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">Timer ring</title>
  <desc id="desc">Circular countdown ring with amber track.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a35f"/>
      <stop offset="1" stop-color="#ef8d74"/>
    </linearGradient>
  </defs>
  <circle cx="90" cy="90" r="74" fill="none" stroke="#15242d" stroke-width="12"/>
  <circle cx="90" cy="90" r="74" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="465 465" stroke-dashoffset="0"/>
  <circle cx="90" cy="90" r="56" fill="#081015" stroke="#d9a35f" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
